services:
  dashboard:
    build: ./dashboard
    restart: unless-stopped
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      TZ: ${TZ:-Europe/Copenhagen}
    volumes:
      - ${APPDATA_DIR:-./appdata}/control:/control
      - ${BACKUP_DIR:?Set BACKUP_DIR in .env}:/photos:ro
    ports:
      - "${DASHBOARD_PORT:-8787}:8787"

  sync:
    image: jakewharton/gphotos-sync:trunk
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/controller/worker.sh"]
    environment:
      TZ: ${TZ:-Europe/Copenhagen}
      SYNC_HOUR: ${SYNC_HOUR:-3}
      CHROMIUM_USER_FLAGS: "--no-sandbox"
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
    volumes:
      - ${APPDATA_DIR:-./appdata}/chrome:/tmp/gphotos-cdp
      - ${APPDATA_DIR:-./appdata}/control:/control
      - ${BACKUP_DIR:?Set BACKUP_DIR in .env}:/download
      - ./worker.sh:/controller/worker.sh:ro

  login:
    image: dorowu/ubuntu-desktop-lxde-vnc:latest
    profiles: ["login"]
    environment:
      RESOLUTION: 1280x800
    volumes:
      - ${APPDATA_DIR:-./appdata}/chrome:/config
    ports:
      - "${LOGIN_PORT:-6080}:80"
    shm_size: "1gb"
