services:
  fotoarkiv:
    image: ghcr.io/bartel1234/fotoarkiv:0.2.0-beta.5
    platform: linux/amd64
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      TZ: ${TZ:-Europe/Copenhagen}
      SYNC_HOUR: ${SYNC_HOUR:-3}
      RESOLUTION: ${RESOLUTION:-1280x800}
    volumes:
      - ${APPDATA_DIR:-./appdata}/control:/control
      - ${APPDATA_DIR:-./appdata}/accounts:/accounts
      - ${APPDATA_DIR:-./appdata}/chrome:/config
      - ${BACKUP_DIR:?Set BACKUP_DIR in .env}:/download
    ports:
      - "${DASHBOARD_PORT:-8787}:8787"
    shm_size: "1gb"
