[supervisord]
nodaemon=true
user=root
logfile=/dev/fd/1
logfile_maxbytes=0
pidfile=/tmp/fotoarkiv-supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/fotoarkiv-supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/fotoarkiv-supervisor.sock

[program:display]
priority=10
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_RESOLUTION)sx24 -nolisten tcp -ac
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:window-manager]
priority=20
command=/usr/bin/openbox
environment=DISPLAY=":99",HOME="/root"
autostart=true
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:login]
priority=30
command=/bin/sh /controller/login-loop.sh
environment=DISPLAY=":99",HOME="/root",USER="root"
autostart=true
autorestart=true
stopwaitsecs=25
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:sync]
priority=30
command=/bin/sh /controller/worker.sh
autostart=true
autorestart=true
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:dashboard]
priority=40
command=/usr/local/bin/python -u /app/app.py
directory=/app
autostart=true
autorestart=true
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
